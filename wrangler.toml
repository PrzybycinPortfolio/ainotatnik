name = "ai-notatnik-api"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Restrict to the deployed frontend origin before going live, e.g. ALLOWED_ORIGIN = "https://ai-notatnik.pages.dev"
ALLOWED_ORIGIN = "https://ai-notatnik.pages.dev,https://*.ai-notatnik.pages.dev"

# Secrets — never put these here. Set them with:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_ANON_KEY
#   wrangler secret put GEMINI_API_KEY
# For local dev, copy .dev.vars.example to .dev.vars instead.
