<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>AI Notatnik</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c26bff"/>
      <stop offset="1" stop-color="#6b21d8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- Notebook page -->
  <rect x="15" y="12" width="32" height="42" rx="5" fill="#fff"/>
  <!-- Binding rings -->
  <g fill="#6b21d8">
    <rect x="11" y="18" width="8" height="4" rx="2"/>
    <rect x="11" y="28" width="8" height="4" rx="2"/>
    <rect x="11" y="38" width="8" height="4" rx="2"/>
  </g>
  <!-- Text lines -->
  <g stroke="#a47ff0" stroke-width="3.2" stroke-linecap="round">
    <line x1="24" y1="27" x2="39" y2="27"/>
    <line x1="24" y1="35" x2="39" y2="35"/>
    <line x1="24" y1="43" x2="33" y2="43"/>
  </g>

  <!-- AI sparkle -->
  <path d="M47 5 C48.2 11.6 50.4 13.8 57 15 C50.4 16.2 48.2 18.4 47 25 C45.8 18.4 43.6 16.2 37 15 C43.6 13.8 45.8 11.6 47 5 Z"
        fill="url(#spark)" stroke="#6b21d8" stroke-width="2" stroke-linejoin="round"/>
</svg>
